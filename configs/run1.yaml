# First GRPO run. Copy this per run and change ONE thing.
extends: base.yaml

run_name: run1
model: Qwen/Qwen3-1.7B

algorithm: grpo
grpo:
  prompts_per_step: 48
  group_size: 8
  temperature: 1.0
  top_p: 1.0                 # full distribution: truncating makes rollouts
  top_k: -1                  # off-policy w.r.t. the ratio we then compute
  steps: 400
  micro_bs: 2
  inner_epochs: 1
  lr: 1.0e-6                 # RL is not SFT; 1e-5 diverges
  clip_low: 0.2
  clip_high: 0.28            # clip-higher (DAPO), keeps entropy alive
  kl_coef: 0.0               # no reference model held in memory
  loss_norm: token_level     # sequence-level down-weights long trajectories
  dynamic_sampling: true     # drop all-right / all-wrong groups
  mask_observations: true    # NON-NEGOTIABLE. see rollout.py

reward:
  primary: token_f1
  format_gate: true
  length_penalty_per_token: 0.02
  free_tokens: 6
  malformed_penalty: 0.05
  extra_call_penalty: 0.02
  max_penalty: 0.3
  reward_tool_use: false     # rewarding calls destroys the no-tool cases
  reward_retrieval_hits: false   # teaches query-stuffing
